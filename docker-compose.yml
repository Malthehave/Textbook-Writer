# Dev stack with hot reload. UI: http://localhost:3000  API: http://localhost:8000
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TEXTBOOK_API_ROOT: /app
      TEXTBOOK_BOOKS_ROOT: /app/output/books
      TEXTBOOK_SESSIONS_DB: /app/output/ui-sessions.sqlite
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./src:/app/src
      - ./output:/app/output
      - ./AGENTS.md:/app/AGENTS.md:ro
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "textbook_writer.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:5173"
    environment:
      VITE_API_PROXY: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  frontend_node_modules:
