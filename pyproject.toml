[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "textbook-writer"
version = "0.2.0"
description = "Local validation and publishing tools for Codex-authored textbooks"
requires-python = ">=3.12"
dependencies = ["pypdf>=6.0,<7", "md2typst>=0.3.6", "playwright>=1.62.0"]

[project.scripts]
textbook = "textbook_writer.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "PyYAML>=6.0.2,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/textbook_writer"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
