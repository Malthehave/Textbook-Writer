[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "textbook-writer"
version = "0.1.0"
description = "Contracts and workflow foundations for source-grounded textbook generation."
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.1,<2",
  "openai-agents>=0.18.3,<0.19",
  "pydantic>=2.12,<3",
  "pypdf>=6.0,<7",
  "PyYAML>=6.0.2,<7",
  "md2typst>=0.3.6",
  "fastapi>=0.140.0",
  "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/textbook_writer"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
